<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Otaku Oasis - Your Fandom Gateway</title>
  <link rel="icon" type="image/png" href="assets/otaku logo main.png">
  <meta name="description" content="Otaku Oasis — anime collectibles & figures." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* (same CSS you had — keeping it unchanged for brevity) */
  </style>
</head>
<body>
  <div id="progress"></div>
  <header>…</header>
  <main>…</main>
  <footer>…</footer>

  <!-- Floating Cart + Modal + Toast -->
  <button id="cartFab" class="cart-fab" aria-label="Open cart">🛒</button>
  <div id="cartPopup" class="cart-popup" aria-hidden="true"></div>
  <div id="modal" class="modal-backdrop" aria-hidden="true"></div>
  <div id="toast" class="toast"></div>

  <script>
    const products = [
      {id:'akaza1', name:'Akaza', priceText:'700tk', price:700, imgs:['assets/akaza1.JPEG','assets/akaza2.JPEG'], desc:'Akaza figure Size:28cm from Demon Slayer.', category:'Demon Slayer'},
      {id:'marin', name:'Marin Kitagawa', priceText:'800tk', price:800, imgs:['assets/marin1.JPEG','assets/marin2.JPEG'], desc:'Limited edition Marin figure.', category:'Other'}
      // ... (other products)
    ];

    const preorders = [
      {id:'pre1', title:'Demon Slayer Chibi Set', eta:'2026-01', note:'Reserve now, limited run.', imgs:['assets/kny1.JPG']},
      {id:'pre2', title:'Jujutsu Kaisen Labubu Set', eta:'2025-12', note:'Bundle pre-order discount.', imgs:['assets/jjkl1.JPG']}
    ];

    const grid = document.getElementById('products-grid');

    function renderProducts(list) {
      grid.innerHTML = '';
      if (!list.length) { document.getElementById('noResults').style.display = 'block'; return; }
      document.getElementById('noResults').style.display = 'none';

      list.forEach(p => {
        const card = document.createElement('article');
        card.className = 'product-card';
        const imgSrc = p.imgs[0] || '';

        card.innerHTML = `
          <div class="thumb"><img loading="lazy" src="${imgSrc}" alt="${p.name}"></div>
          <div class="p-title">${p.name}</div>
          <div class="p-desc">${p.desc}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <div class="p-price">${p.priceText}</div>
            <div class="card-actions">
              <button class="btn ghost" data-id="${p.id}" data-action="details">Details</button>
              <button class="btn primary" data-id="${p.id}" data-action="add">Add</button>
            </div>
          </div>
        `;

        card.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            const prod = products.find(x => x.id === id);
            if (action === 'add') { addToCart(prod); showToast(`${prod.name} added to cart`); }
            if (action === 'details') { showDetails(prod); }
          });
        });

        card.addEventListener('click', () => showDetails(p));
        grid.appendChild(card);
      });
    }

    function renderPreorders() {
      const preList = document.getElementById('pre-list');
      preList.innerHTML = '';
      preorders.forEach(p => {
        preList.innerHTML += `
          <article class="product-card">
            <div class="thumb"><img loading="lazy" src="${p.imgs[0]}" alt="${p.title}"></div>
            <div class="p-title">${p.title}</div>
            <div class="p-desc">ETA: ${p.eta}<br>${p.note}</div>
            <div class="card-actions">
              <button class="btn ghost" data-id="${p.id}" data-action="pre-details">Details</button>
              <button class="btn primary" data-id="${p.id}" data-action="pre-order">Pre-order</button>
            </div>
          </article>`;
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Initialize
    renderProducts(products);
    renderPreorders();
  </script>
</body>
</html>
