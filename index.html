<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otaku Oasis</title>

<link rel="icon" href="assets/otaku logo main.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05040a;
  --accent1:#b63cff;
  --accent2:#7b5cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui;
  color:#e9eef8;
  background:#05040a;
  overflow-x:hidden;
}

/* 🔥 Animated background */
.bg-anim{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(circle at 20% 20%,rgba(182,60,255,.25),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(123,92,255,.18),transparent 40%),
    radial-gradient(circle at 50% 80%,rgba(182,60,255,.2),transparent 45%);
  animation:bgMove 18s linear infinite alternate;
}

@keyframes bgMove{
  0%{transform:scale(1) translateY(0)}
  100%{transform:scale(1.1) translateY(-40px)}
}

header{
  position:sticky;
  top:0;
  backdrop-filter:blur(10px);
  background:rgba(5,4,10,.75);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:10;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand img{height:42px;border-radius:8px}
.brand span{
  font-family:Orbitron;
  color:var(--accent1);
  font-size:18px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 18px 100px;
}

.hero{
  padding:26px;
  border-radius:14px;
  background:rgba(255,255,255,.02);
}

.hero h1{
  font-family:Orbitron;
  font-size:34px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:24px;
}

.card{
  background:rgba(255,255,255,.02);
  border-radius:14px;
  padding:12px;
  transition:.35s;
}
.card:hover{transform:translateY(-6px)}

.thumb{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.thumb img{
  max-width:100%;
  max-height:100%;
}

.title{font-weight:800;margin-top:8px}
.price{color:var(--accent1);font-weight:900}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#05040a;
  font-weight:900;
  margin-top:10px;
  cursor:pointer;
}

/* 🖼 Image modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99;
}
.modal.open{display:flex}
.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

/* 🛒 cart */
.cart-btn{
  position:fixed;
  right:16px;
  bottom:16px;
  height:56px;
  width:56px;
  border-radius:50%;
  background:linear-gradient(180deg,var(--accent1),var(--accent2));
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

@media(max-width:520px){
  .hero h1{font-size:26px}
}
</style>
</head>

<body>

<div class="bg-anim"></div>

<header>
  <div class="nav">
    <div class="brand">
      <img src="assets/wb otaku.PNG">
      <span>Otaku Oasis</span>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Anime Figures for True Otakus</h1>
    <p>Limited pieces • Collector focused</p>
  </section>

  <section>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="cart-btn">🛒</div>

<div class="modal" id="imgModal" onclick="this.classList.remove('open')">
  <img id="modalImg">
</div>

<script>
const products=[
{id:'akaza1', name:'Akaza', priceText:'700tk', price:700, imgs:['assets/akaza1.JPEG','assets/akaza2.JPEG','assets/akaza3.JPEG'], desc:'Akaza figure Size:28cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'marin', name:'Marin Kitagawa', priceText:'800tk', price:800, imgs:['assets/marin1.JPEG','assets/marin2.JPEG','assets/marin3.JPEG'], desc:'Limited edition Marin figure from My Dressup Darling with box.', category:'Other'},
  {id:'tanjiro', name:'Tanjiro', priceText:'800tk', price:800, imgs:['assets/tanjiro1.JPG','assets/tanjiro2.JPG','assets/tanjiro3.JPG'], desc:'Tanjiro Kamado Size:28cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'makima', name:'Bunny Makima', priceText:'2000tk', price:2000, imgs:['assets/makima1.jpeg','assets/makima2.jpeg','assets/makima3.jpeg'], desc:'Original Furyu Makima figure Size:28cm from Chainsawman with box.', category:'Chainsawman'},
  {id:'rem', name:'Rem', priceText:'600tk', price:600, imgs:['assets/rem1.jpg','assets/rem2.JPEG','assets/rem3.jpg'], desc:'Rem figure Size:28cm from Re:Zero.', category:'Other'},
  {id:'tohka', name:'Tohka Yatogami', priceText:'800tk', price:800, imgs:['assets/tohka1.jpg','assets/tohka2.jpg','assets/tohka3.jpg'], desc:'Tohka Yatogami figure Size:28cm from Date a Live Girl.', category:'Other'},
  {id:'chibi1', name:'Chibi Zenitsu', priceText:'500tk', price:500, imgs:['assets/zenitsu.small.jpg'], desc:'Chibi cute Zenitsu figure Size:8cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'chibi2', name:'Chibi Nezuko', priceText:'500tk', price:500, imgs:['assets/nezuko.small.jpg'], desc:'Chibi cute Nezuko figure Size:8cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'zoro1', name:'Zoro Three Swords', priceText:'900tk', price:900, imgs:['assets/zoro1.jpeg','assets/zoro2.jpeg','assets/zoro3.jpeg'], desc:'Zoro Three Sword Figure Size:23.5cm from One Piece.', category:'One Piece'},
  {id:'pw1', name:'Pocket Watch OP', priceText:'900tk', price:900, imgs:['assets/opw1.JPEG','assets/opw2.JPEG','assets/opw3.JPEG'], desc:'One Piece Pocket Watch from One Piece.', category:'One Piece'},
  {id:'mini1', name:'Mini Naruto Set', priceText:'300tk', price:300, imgs:['assets/n1.jpeg','assets/n2.jpeg','assets/n3.jpeg'], desc:'Cute mini figures (each) Size:8cm from Naruto.', category:'Naruto'},
  {id:'mini2', name:'Mini Naruto Set', priceText:'300tk', price:300, imgs:['assets/n4.JPG'], desc:'Cute mini figures(each) Size:6.5cm from Naruto.', category:'Naruto'},
  {id:'mini3', name:'Mini Naruto Set', priceText:'350tk', price:350, imgs:['assets/n5.JPG'], desc:'Cute mini figures(each) Size:10cm from Naruto.', category:'Naruto'},
  {id:'gojol', name:'Labubu Gojo', priceText:'800tk', price:800, imgs:['assets/lgojo1.JPG'], desc:'Cute Labubu Gojo from Jujutsu Kaisen.', category:'Jujutsu Kaisen'}
];

const grid=document.getElementById('grid');
const modal=document.getElementById('imgModal');
const modalImg=document.getElementById('modalImg');

products.forEach(p=>{
 const c=document.createElement('div');
 c.className='card';
 c.innerHTML=`
  <div class="thumb"><img src="${p.img}"></div>
  <div class="title">${p.name}</div>
  <div class="price">${p.priceText}</div>
  <button>Add to Cart</button>
 `;
 c.querySelector('.thumb').onclick=()=>{
  modalImg.src=p.img;
  modal.classList.add('open');
 };
 grid.appendChild(c);
});
</script>

</body>
</html>
