<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otaku Oasis - Your Fandom Gateway</title>

<link rel="icon" type="image/png" href="assets/otaku logo main.png">
<meta name="description" content="Otaku Oasis — anime collectibles & figures." />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07060a;
  --surface:#0c0b10;
  --muted:#9aa0a6;
  --accent1:#b63cff;
  --accent2:#7b5cff;
  --radius:14px;
  --max-width:1100px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:linear-gradient(180deg,var(--bg),#020205);
  color:#e9eef8;
}

header{
  position:sticky;
  top:0;
  background:rgba(7,6,10,.8);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.04);
  z-index:50;
}

.nav-wrap{
  max-width:var(--max-width);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 18px;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
}
.brand img{height:42px;border-radius:8px}
.brand h1{margin:0;font-size:18px;color:var(--accent1)}

nav a{
  color:var(--muted);
  text-decoration:none;
  margin-left:14px;
  font-weight:700;
}
nav a:hover{color:#fff}

main{
  max-width:var(--max-width);
  margin:auto;
  padding:24px 18px;
}

.hero{
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));
  border-radius:var(--radius);
  padding:28px;
}

.hero h2{
  font-family:Orbitron;
  font-size:34px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{color:var(--muted)}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:18px;
}

.controls input,.controls select{
  padding:12px;
  border-radius:10px;
  background:transparent;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;
  font-weight:700;
}

.section{margin-top:36px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.product-card{
  background:rgba(255,255,255,.015);
  border-radius:12px;
  padding:12px;
  transition:.3s;
}
.product-card:hover{
  transform:translateY(-6px) scale(1.01);
}

.thumb{
  height:200px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.thumb img{
  max-height:100%;
  max-width:100%;
}

.p-title{font-weight:800;margin:8px 0}
.p-desc{color:var(--muted);font-size:13px}
.p-price{color:var(--accent1);font-weight:900;font-size:17px}

.btn{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-weight:900;
  cursor:pointer;
  min-height:44px;
}
.btn.primary{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#05060a;
}
.btn.ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,.1);
  color:var(--muted);
}

.cart-fab{
  position:fixed;
  right:14px;
  bottom:14px;
  height:54px;
  width:54px;
  border-radius:50%;
  background:linear-gradient(180deg,var(--accent1),var(--accent2));
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  cursor:pointer;
}

.cart-popup{
  position:fixed;
  right:10px;
  left:10px;
  bottom:80px;
  background:rgba(12,11,16,.98);
  border-radius:12px;
  padding:12px;
  display:none;
}
.cart-popup.open{display:block}

@media(max-width:520px){
  .hero h2{font-size:26px}
}
</style>
</head>

<body>

<header>
  <div class="nav-wrap">
    <div class="brand">
      <img src="assets/wb otaku.PNG">
      <h1>Otaku Oasis</h1>
    </div>
    <nav>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>

<section class="hero">
  <h2>Rare Anime Figures & Collectibles</h2>
  <p>Hand-picked figures for true collectors.</p>

  <div class="controls">
    <input id="search" placeholder="Search figures">
    <select id="categoryFilter">
      <option value="">All</option>
      <option>Naruto</option>
      <option>Demon Slayer</option>
      <option>Jujutsu Kaisen</option>
      <option>One Piece</option>
      <option>Chainsawman</option>
    </select>
  </div>
</section>

<section id="shop" class="section">
  <h3 style="color:var(--accent2)">Shop</h3>
  <div id="products-grid" class="grid"></div>
</section>

<section id="about" class="section">
  <h3 style="color:var(--accent2)">About</h3>
  <p style="color:var(--muted)">
    Otaku Oasis brings premium anime figures at collector-friendly prices.
  </p>
</section>

<section id="contact" class="section">
  <h3 style="color:var(--accent2)">Contact</h3>
  <p>Email: techoasis0cloud@gmail.com</p>
  <p>
    <a href="https://www.facebook.com/otakuoasisbd" target="_blank">Facebook</a> •
    <a href="https://www.instagram.com/theotakuoasisbd" target="_blank">Instagram</a>
  </p>
</section>

</main>

<button class="cart-fab" id="cartFab">🛒</button>

<div class="cart-popup" id="cartPopup">
  <h4>Cart</h4>
  <div id="cartItems"></div>
  <strong id="cartTotal"></strong><br><br>
  <button class="btn primary" id="checkoutBtn">Checkout</button>
</div>

<script>
const products = [
  {id:'akaza1', name:'Akaza', priceText:'700tk', price:700, imgs:['assets/akaza1.JPEG','assets/akaza2.JPEG','assets/akaza3.JPEG'], desc:'Akaza figure Size:28cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'marin', name:'Marin Kitagawa', priceText:'800tk', price:800, imgs:['assets/marin1.JPEG','assets/marin2.JPEG','assets/marin3.JPEG'], desc:'Limited edition Marin figure from My Dressup Darling with box.', category:'Other'},
  {id:'tanjiro', name:'Tanjiro', priceText:'800tk', price:800, imgs:['assets/tanjiro1.JPG','assets/tanjiro2.JPG','assets/tanjiro3.JPG'], desc:'Tanjiro Kamado Size:28cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'makima', name:'Bunny Makima', priceText:'2000tk', price:2000, imgs:['assets/makima1.jpeg','assets/makima2.jpeg','assets/makima3.jpeg'], desc:'Original Furyu Makima figure Size:28cm from Chainsawman with box.', category:'Chainsawman'},
  {id:'rem', name:'Rem', priceText:'600tk', price:600, imgs:['assets/rem1.jpg','assets/rem2.JPEG','assets/rem3.jpg'], desc:'Rem figure Size:28cm from Re:Zero.', category:'Other'},
  {id:'tohka', name:'Tohka Yatogami', priceText:'800tk', price:800, imgs:['assets/tohka1.jpg','assets/tohka2.jpg','assets/tohka3.jpg'], desc:'Tohka Yatogami figure Size:28cm from Date a Live Girl.', category:'Other'},
  {id:'chibi1', name:'Chibi Zenitsu', priceText:'500tk', price:500, imgs:['assets/zenitsu.small.jpg'], desc:'Chibi cute Zenitsu figure Size:8cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'chibi2', name:'Chibi Nezuko', priceText:'500tk', price:500, imgs:['assets/nezuko.small.jpg'], desc:'Chibi cute Nezuko figure Size:8cm from Demon Slayer.', category:'Demon Slayer'},
  {id:'zoro1', name:'Zoro Three Swords', priceText:'900tk', price:900, imgs:['assets/zoro1.jpeg','assets/zoro2.jpeg','assets/zoro3.jpeg'], desc:'Zoro Three Sword Figure Size:23.5cm from One Piece.', category:'One Piece'},
  {id:'pw1', name:'Pocket Watch OP', priceText:'900tk', price:900, imgs:['assets/opw1.JPEG','assets/opw2.JPEG','assets/opw3.JPEG'], desc:'One Piece Pocket Watch from One Piece.', category:'One Piece'},
  {id:'mini1', name:'Mini Naruto Set', priceText:'300tk', price:300, imgs:['assets/n1.jpeg','assets/n2.jpeg','assets/n3.jpeg'], desc:'Cute mini figures (each) Size:8cm from Naruto.', category:'Naruto'},
  {id:'mini2', name:'Mini Naruto Set', priceText:'300tk', price:300, imgs:['assets/n4.JPG'], desc:'Cute mini figures(each) Size:6.5cm from Naruto.', category:'Naruto'},
  {id:'mini3', name:'Mini Naruto Set', priceText:'350tk', price:350, imgs:['assets/n5.JPG'], desc:'Cute mini figures(each) Size:10cm from Naruto.', category:'Naruto'},
  {id:'gojol', name:'Labubu Gojo', priceText:'800tk', price:800, imgs:['assets/lgojo1.JPG'], desc:'Cute Labubu Gojo from Jujutsu Kaisen.', category:'Jujutsu Kaisen'}
];

const grid=document.getElementById('products-grid');

function render(list){
 grid.innerHTML='';
 list.forEach(p=>{
  const c=document.createElement('div');
  c.className='product-card';
  c.innerHTML=`
   <div class="thumb"><img src="${p.imgs[0]}"></div>
   <div class="p-title">${p.name}</div>
   <div class="p-desc">${p.desc}</div>
   <div class="p-price">${p.priceText}</div>
   <button class="btn primary" onclick="addToCart('${p.id}')">Add</button>
  `;
  grid.appendChild(c);
 });
}

let cart=[];
function addToCart(id){
 const p=products.find(x=>x.id===id);
 cart.push(p);
 updateCart();
}

function updateCart(){
 const items=document.getElementById('cartItems');
 items.innerHTML='';
 let total=0;
 cart.forEach(i=>{
  total+=i.price;
  items.innerHTML+=`<div>${i.name} - ${i.priceText}</div>`;
 });
 document.getElementById('cartTotal').textContent=`Total: Tk ${total}`;
}

document.getElementById('cartFab').onclick=()=>{
 document.getElementById('cartPopup').classList.toggle('open');
};

document.getElementById('checkoutBtn').onclick=()=>{
 if(!cart.length){alert('Cart empty');return;}
 let msg='ORDER SUMMARY\n\n';
 let total=0;
 cart.forEach(i=>{
  msg+=`${i.name} - ${i.priceText}\n`;
  total+=i.price;
 });
 msg+=`\nTotal: Tk ${total}\n\nPlease contact us via Facebook or Email.`;
 alert(msg);
};

render(products);
</script>

</body>
</html>
