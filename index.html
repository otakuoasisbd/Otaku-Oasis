<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otaku Oasis</title>
<style>
:root {
  --bg:#0a0a0f;
  --card-bg:rgba(25,25,35,0.7);
  --glass-border:rgba(255,255,255,0.1);
  --text:#fff;
  --accent:#b63cff;
}
body {
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
header {
  backdrop-filter:blur(8px);
  background:rgba(20,20,30,0.6);
  border-bottom:1px solid var(--glass-border);
  position:fixed;
  top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 30px;z-index:100;
}
.logo {font-size:22px;font-weight:900;color:var(--accent);}
nav a {color:var(--text);margin:0 12px;text-decoration:none;font-weight:500;}
nav a:hover {color:var(--accent);}
main {padding-top:90px;}
#shop {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding:40px;
}
.card {
  background:var(--card-bg);
  border:1px solid var(--glass-border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.card:hover {
  transform:translateY(-5px);
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}
.card img {
  width:100%;height:260px;object-fit:cover;
}
.card-content {
  padding:15px;
}
.card h3 {
  margin:5px 0;
  font-size:18px;
}
.price {
  color:var(--accent);
  font-weight:700;
  margin-top:6px;
}
.filters {
  text-align:center;
  margin:20px;
}
input,select {
  padding:8px;
  border-radius:8px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  margin:0 6px;
}
button {
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#b63cff,#7b5cff);
  font-weight:700;
  color:#000;
  cursor:pointer;
}
button:hover {opacity:0.9;}
</style>
</head>
<body>
<header>
  <div class="logo">Otaku Oasis</div>
  <nav>
    <a href="#shop">Shop</a>
    <a href="#cart">Cart</a>
  </nav>
</header>

<main>
  <div class="filters">
    <input type="text" id="search" placeholder="Search figures...">
    <select id="category">
      <option value="all">All</option>
      <option value="anime">Anime</option>
      <option value="game">Game</option>
    </select>
    <select id="sort">
      <option value="default">Sort</option>
      <option value="low-high">Price: Low → High</option>
      <option value="high-low">Price: High → Low</option>
    </select>
  </div>

  <section id="shop"></section>
</main>

<script>
// === Product Data ===
const products = [
  {id:'akaza1', name:'Akaza', priceText:'700tk', price:700, category:'anime', img:'assets/akaza1.JPEG'},
  {id:'marin', name:'Marin Kitagawa', priceText:'800tk', price:800, category:'anime', img:'assets/marin1.JPEG'},
  {id:'gojo', name:'Gojo Satoru', priceText:'650tk', price:650, category:'anime', img:'assets/gojo.JPEG'},
  {id:'levi', name:'Levi Ackerman', priceText:'900tk', price:900, category:'anime', img:'assets/levi.JPEG'},
  {id:'zenitsu', name:'Zenitsu', priceText:'750tk', price:750, category:'anime', img:'assets/zenitsu.JPEG'},
];

// === Render Products ===
const shop = document.getElementById('shop');
function renderProducts(list){
  shop.innerHTML='';
  list.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <img src="${p.img}" alt="${p.name}">
      <div class="card-content">
        <h3>${p.name}</h3>
        <div class="price">${p.priceText}</div>
      </div>`;
    // open product page
    card.addEventListener('click', ()=>{
      window.location.href = `product.html?id=${p.id}`;
    });
    shop.appendChild(card);
  });
}
renderProducts(products);

// === Filters ===
const searchInput=document.getElementById('search');
const catSelect=document.getElementById('category');
const sortSelect=document.getElementById('sort');

function applyFilters(){
  let filtered=[...products];
  const query=searchInput.value.toLowerCase();
  const cat=catSelect.value;
  const sort=sortSelect.value;

  if(query){
    filtered=filtered.filter(p=>p.name.toLowerCase().includes(query));
  }
  if(cat!=='all'){
    filtered=filtered.filter(p=>p.category===cat);
  }
  if(sort==='low-high'){
    filtered.sort((a,b)=>a.price-b.price);
  }else if(sort==='high-low'){
    filtered.sort((a,b)=>b.price-a.price);
  }
  renderProducts(filtered);
}

searchInput.addEventListener('input',applyFilters);
catSelect.addEventListener('change',applyFilters);
sortSelect.addEventListener('change',applyFilters);
</script>
</body>
</html>
