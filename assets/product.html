<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Details - Otaku Oasis</title>
<style>
body{
  background:#0a0a0f;
  color:#fff;
  font-family:Inter,sans-serif;
  margin:0;
  padding:30px;
}
.container{
  max-width:800px;
  margin:0 auto;
}
a{
  color:#b63cff;
  text-decoration:none;
  font-weight:600;
}
h1{margin-top:10px;}
.main-img{
  width:100%;
  border-radius:10px;
  margin:20px 0;
}
.price{
  color:#b63cff;
  font-weight:900;
  font-size:18px;
}
.btn{
  padding:12px 18px;
  background:linear-gradient(90deg,#b63cff,#7b5cff);
  color:#000;
  border:none;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}
.btn:hover{opacity:.9;}
.thumbs img{
  width:80px;
  border-radius:6px;
  margin-right:8px;
  cursor:pointer;
  opacity:.8;
}
.thumbs img.active{opacity:1; border:2px solid #b63cff;}
</style>
</head>
<body>
<div class="container">
  <a href="index.html">← Back to Shop</a>
  <h1 id="title"></h1>
  <img id="mainImage" class="main-img" src="" alt="">
  <div class="thumbs" id="thumbs"></div>
  <p id="desc"></p>
  <p class="price" id="price"></p>
  <button id="addBtn" class="btn">Add to Cart</button>
</div>

<script>
const products=[
  {id:'akaza1',name:'Akaza',priceText:'700tk',price:700,imgs:['assets/akaza1.JPEG','assets/akaza2.JPEG','assets/akaza3.JPEG'],desc:'Akaza figure Size:28cm from Demon Slayer.'},
  {id:'marin',name:'Marin Kitagawa',priceText:'800tk',price:800,imgs:['assets/marin1.JPEG','assets/marin2.JPEG','assets/marin3.JPEG'],desc:'Limited edition Marin figure from My Dressup Darling with box.'},
  {id:'gojo',name:'Gojo Satoru',priceText:'650tk',price:650,imgs:['assets/gojo.JPEG'],desc:'Gojo Satoru Jujutsu Kaisen figure, detailed sculpt, perfect for collectors.'},
  {id:'levi',name:'Levi Ackerman',priceText:'900tk',price:900,imgs:['assets/levi.JPEG'],desc:'Levi Ackerman from Attack on Titan — premium edition figure.'},
  {id:'zenitsu',name:'Zenitsu',priceText:'750tk',price:750,imgs:['assets/zenitsu.JPEG'],desc:'Zenitsu figure with detailed kimono pattern.'},
];

const params=new URLSearchParams(window.location.search);
const id=params.get('id');
const p=products.find(x=>x.id===id);

if(!p){
  document.body.innerHTML='<h2 style="text-align:center">Product not found</h2>';
}else{
  document.getElementById('title').textContent=p.name;
  document.getElementById('mainImage').src=p.imgs[0];
  document.getElementById('desc').textContent=p.desc;
  document.getElementById('price').textContent=p.priceText;

  const thumbs=document.getElementById('thumbs');
  p.imgs.forEach((src,i)=>{
    const img=document.createElement('img');
    img.src=src;
    if(i===0) img.classList.add('active');
    img.addEventListener('click',()=>{
      document.getElementById('mainImage').src=src;
      thumbs.querySelectorAll('img').forEach(x=>x.classList.remove('active'));
      img.classList.add('active');
    });
    thumbs.appendChild(img);
  });
}

document.getElementById('addBtn').addEventListener('click',()=>{
  alert(`${p.name} added to cart (feature coming soon)`);
});
</script>
</body>
</html>
